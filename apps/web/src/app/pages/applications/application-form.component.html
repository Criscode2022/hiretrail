<div class="mb-6">
  <a routerLink="/app/applications" class="text-xs text-muted hover:text-fg">← Applications</a>
  <h1 class="page-title mt-2">New application</h1>
  <p class="page-sub">Log a role and keep the pipeline honest.</p>
</div>

<form class="card max-w-2xl space-y-5 p-6" [formGroup]="form" (ngSubmit)="submit()">
  <div>
    <label class="label" for="companyId">Company</label>
    <select id="companyId" class="field" formControlName="companyId">
      @for (c of companies(); track c.id) {
        <option [value]="c.id">{{ c.name }}</option>
      }
    </select>
    <div class="mt-2 flex gap-2">
      <input
        type="text"
        class="field"
        placeholder="Quick-add company name"
        formControlName="newCompanyName"
      />
      <button
        type="button"
        class="btn-secondary shrink-0"
        [disabled]="creatingCompany()"
        (click)="createCompanyQuick()"
      >
        Add
      </button>
    </div>
  </div>

  <div>
    <label class="label" for="title">Role title</label>
    <input id="title" type="text" class="field" formControlName="title" />
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div>
      <label class="label" for="status">Status</label>
      <select id="status" class="field" formControlName="status">
        @for (s of statuses; track s) {
          <option [value]="s">{{ statusLabels[s] }}</option>
        }
      </select>
    </div>
    <div>
      <label class="label" for="priority">Priority</label>
      <select id="priority" class="field" formControlName="priority">
        @for (p of priorities; track p) {
          <option [value]="p">{{ p }}</option>
        }
      </select>
    </div>
  </div>

  <div class="grid gap-4 sm:grid-cols-3">
    <div>
      <label class="label" for="salaryMin">Salary min</label>
      <input id="salaryMin" type="number" class="field" formControlName="salaryMin" />
    </div>
    <div>
      <label class="label" for="salaryMax">Salary max</label>
      <input id="salaryMax" type="number" class="field" formControlName="salaryMax" />
    </div>
    <div>
      <label class="label" for="currency">Currency</label>
      <input id="currency" type="text" class="field" formControlName="currency" />
    </div>
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div>
      <label class="label" for="location">Location</label>
      <input id="location" type="text" class="field" formControlName="location" />
    </div>
    <div>
      <label class="label" for="source">Source</label>
      <input id="source" type="text" class="field" formControlName="source" />
    </div>
  </div>

  <div>
    <label class="label" for="jobUrl">Job URL</label>
    <input id="jobUrl" type="url" class="field" formControlName="jobUrl" />
  </div>

  <label class="flex items-center gap-2 text-sm text-muted">
    <input type="checkbox" formControlName="remote" class="h-4 w-4 rounded border-line" />
    Remote-friendly
  </label>

  <div>
    <label class="label" for="description">Notes / JD summary</label>
    <textarea id="description" rows="4" class="field" formControlName="description"></textarea>
  </div>

  @if (error()) {
    <div class="rounded-xl border border-danger/30 bg-danger/10 px-3 py-2 text-sm text-danger">
      {{ error() }}
    </div>
  }

  <div class="flex gap-2">
    <button type="submit" class="btn-primary" [disabled]="loading()">
      {{ loading() ? 'Saving…' : 'Create application' }}
    </button>
    <a routerLink="/app/applications" class="btn-secondary">Cancel</a>
  </div>
</form>
