<div class="flex min-h-screen">
  <!-- Desktop sidebar -->
  <aside
    class="sticky top-0 hidden h-screen w-64 shrink-0 flex-col border-r border-line bg-surface/80 px-4 py-6 backdrop-blur lg:flex"
  >
    <a routerLink="/app/dashboard" class="mb-8 flex items-center gap-2.5 px-2">
      <span
        class="flex h-9 w-9 items-center justify-center rounded-xl border border-line bg-elevated font-mono text-sm font-semibold tracking-tight"
        >HT</span
      >
      <div>
        <div class="text-sm font-semibold tracking-tight">HireTrail</div>
        <div class="text-xs text-subtle">Job application CRM</div>
      </div>
    </a>

    <nav class="flex flex-1 flex-col gap-1">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="nav-link-active"
          class="nav-link"
        >
          <span class="font-mono text-[10px] uppercase tracking-wider text-subtle">{{
            item.icon.slice(0, 2)
          }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="mt-auto space-y-3 border-t border-line pt-4">
      <div class="px-2">
        <div class="truncate text-sm font-medium">{{ auth.user()?.name }}</div>
        <div class="truncate text-xs text-subtle">{{ auth.user()?.email }}</div>
      </div>
      <button type="button" class="btn-ghost w-full justify-start" (click)="logout()">
        Sign out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Mobile top bar -->
    <header
      class="sticky top-0 z-30 flex items-center justify-between border-b border-line bg-bg/90 px-4 py-3 backdrop-blur lg:hidden"
    >
      <a routerLink="/app/dashboard" class="flex items-center gap-2">
        <span
          class="flex h-8 w-8 items-center justify-center rounded-lg border border-line bg-surface font-mono text-xs font-semibold"
          >HT</span
        >
        <span class="text-sm font-semibold">HireTrail</span>
      </a>
      <button type="button" class="btn-secondary px-3 py-2" (click)="toggleMobile()">
        Menu
      </button>
    </header>

    @if (mobileOpen()) {
      <div class="fixed inset-0 z-40 lg:hidden">
        <div class="absolute inset-0 bg-black/60" (click)="closeMobile()"></div>
        <div
          class="absolute inset-y-0 left-0 flex w-72 flex-col border-r border-line bg-surface p-4 shadow-panel"
        >
          <div class="mb-6 flex items-center justify-between">
            <span class="text-sm font-semibold">Navigate</span>
            <button type="button" class="btn-ghost px-2 py-1" (click)="closeMobile()">
              Close
            </button>
          </div>
          <nav class="flex flex-col gap-1">
            @for (item of nav; track item.path) {
              <a
                [routerLink]="item.path"
                routerLinkActive="nav-link-active"
                class="nav-link"
                (click)="closeMobile()"
              >
                {{ item.label }}
              </a>
            }
          </nav>
          <button type="button" class="btn-ghost mt-auto justify-start" (click)="logout()">
            Sign out
          </button>
        </div>
      </div>
    }

    <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
      <router-outlet />
    </main>
  </div>
</div>
