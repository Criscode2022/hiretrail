services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # Set DATABASE_URL to your Neon connection string for production Postgres
      DATABASE_URL: ${DATABASE_URL:-}
      SQLITE_PATH: /app/data/hiretrail.sqlite
    volumes:
      - hiretrail-data:/app/data

volumes:
  hiretrail-data:
